name: Desktop trial
on:
  workflow_dispatch:
  push:
    branches: [codex/desktop-mineru-trial]
    paths:
      - 'desktop/**'
      - 'tools/jev/questions.py'
      - '.github/workflows/desktop-trial.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s desktop/tests -v
